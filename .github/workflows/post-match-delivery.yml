name: Generate post-match report bundle

on:
  workflow_dispatch:
    inputs:
      impect_match_id:
        description: "Optional explicit Impect match ID"
        required: false
        type: string
      dvms_match_id:
        description: "Optional explicit DVMS/Opta match ID"
        required: false
        type: string
      archive_release:
        description: "Publish the generated PDFs as a private release"
        default: false
        type: boolean
  schedule:
    # The gate below selects 10:00, 12:00, 14:00, 16:00 and 18:00 London
    # time from this union of GMT/BST UTC hours.
    - cron: "0 9-18 * * *"

concurrency:
  group: post-match-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DVMS_ROLE: DEV_ROLE
      DVMS_WAREHOUSE: DEVELOPMENT_WH
      DVMS_DATABASE: CAFC_DB
      CAFC_DVMS_CACHE: ${{ github.workspace }}/.cache/cafc-dvms
    steps:
      - name: Gate London schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ " 10 12 14 16 18 " == *" $(TZ=Europe/London date +%H) "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install report dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt
          pip install -r reports/set_piece/requirements.txt

      - name: Restore DVMS cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/cafc-dvms
          key: dvms-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dvms-${{ runner.os }}-

      - name: Restore set-piece league events cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          # Without this, every run does a full-season "select *" from
          # Snowflake with no local extract present (the parquet cache
          # QueryRunner writes to is gitignored, dev-machine only) -- a
          # season-scale fetch_pandas_all() this repeatedly caused the
          # set-piece subprocess to die silently (OOM) with no traceback.
          path: reports/set_piece/data/processed
          key: set-piece-league-events-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            set-piece-league-events-${{ runner.os }}-

      - name: Write Snowflake private key
        if: steps.gate.outputs.run == 'true'
        env:
          SNOWFLAKE_PRIVATE_KEY_PEM: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/snowflake_key.pem"
          chmod 600 "$RUNNER_TEMP/snowflake_key.pem"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_key.pem" >> "$GITHUB_ENV"

      - name: Warm set-piece league events cache
        # A cold cache means the set-piece step's first Snowflake call is an
        # uncached full-season "select *" (the exact query that OOM-killed
        # the set-piece subprocess with no traceback -- see generation.py's
        # _log_mem history). Doing that pull here instead means: (a) it runs
        # alone, before Chromium/DVMS have used any of the runner's ~7GB, and
        # (b) a successful pull is saved immediately below, rather than
        # depending on the rest of this job -- including the flaky
        # Chromium/weasyprint steps -- completing so the automatic post-job
        # cache save can run.
        if: steps.gate.outputs.run == 'true'
        id: warm_cache
        working-directory: reports/set_piece
        run: |
          if [ -f data/processed/league_events.parquet ]; then
          echo "League events cache already warm."
          echo "warmed=false" >> "$GITHUB_OUTPUT"
          exit 0
          fi
          python -u - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src.db.query_runner import QueryRunner
          QueryRunner().load_league_events()
          print("League events pulled and cached.")
          PY
          echo "warmed=true" >> "$GITHUB_OUTPUT"

      - name: Save set-piece league events cache
        if: steps.gate.outputs.run == 'true' && steps.warm_cache.outputs.warmed == 'true'
        uses: actions/cache/save@v4
        with:
          path: reports/set_piece/data/processed
          key: set-piece-league-events-${{ runner.os }}-${{ github.run_id }}

      - name: Resolve fixture
        if: steps.gate.outputs.run == 'true'
        id: fixture
        env:
          EXPLICIT_IMPECT: ${{ inputs.impect_match_id }}
          EXPLICIT_DVMS: ${{ inputs.dvms_match_id }}
          AUTOMATION_START_DATE: ${{ vars.AUTOMATION_START_DATE }}
          CAFC_TEAM_NAME: ${{ vars.CAFC_TEAM_NAME }}
        run: |
          if [ -n "$EXPLICIT_IMPECT" ] || [ -n "$EXPLICIT_DVMS" ]; then
            if [ -z "$EXPLICIT_IMPECT" ] || [ -z "$EXPLICIT_DVMS" ]; then
              echo "Both explicit match IDs are required" >&2
              exit 2
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "impect_id=$EXPLICIT_IMPECT" >> "$GITHUB_OUTPUT"
            echo "dvms_id=$EXPLICIT_DVMS" >> "$GITHUB_OUTPUT"
          else
            discovery_args=(--team "${CAFC_TEAM_NAME:-Charlton Athletic}" --json)
            if [ -n "$AUTOMATION_START_DATE" ]; then
              discovery_args+=(--not-before "$AUTOMATION_START_DATE")
            fi
            set +e
            python -u -m post_match_reports discover "${discovery_args[@]}" \
              > "$RUNNER_TEMP/discovery.json" 2> "$RUNNER_TEMP/discovery.err"
            discover_status=$?
            set -e
            if [ "$discover_status" -ne 0 ] || [ ! -s "$RUNNER_TEMP/discovery.json" ]; then
              echo "discover exited with status $discover_status" >&2
              echo "--- stdout ---" >&2
              cat "$RUNNER_TEMP/discovery.json" >&2
              echo "--- stderr ---" >&2
              cat "$RUNNER_TEMP/discovery.err" >&2
              exit 1
            fi
            python - "$RUNNER_TEMP/discovery.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as out:
              out.write(f"ready={str(data['ready']).lower()}\n")
              if data["ready"]:
                  out.write(f"impect_id={data['fixture']['impect_match_id']}\n")
                  out.write(f"dvms_id={data['fixture']['dvms_match_id']}\n")
          PY
          fi

      - name: Check delivery release
        if: steps.fixture.outputs.ready == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: match-${{ steps.fixture.outputs.impect_id }}
        run: |
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            draft="$(jq -r .isDraft "$RUNNER_TEMP/release.json")"
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            echo "A release already exists for $TAG; automatic resend is blocked."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate complete bundle
        if: steps.fixture.outputs.ready == 'true' && steps.release.outputs.exists == 'false'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          # GitHub-hosted runners occasionally get torn down mid-job
          # ("The runner has received a shutdown signal" / operation
          # canceled) with no relation to this command's own logic; one
          # retry absorbs that infra flakiness instead of requiring a
          # manual re-run.
          command: |
            python -m post_match_reports generate \
              --impect-match-id "${{ steps.fixture.outputs.impect_id }}" \
              --dvms-match-id "${{ steps.fixture.outputs.dvms_id }}" \
              --output-dir "dist/${{ steps.fixture.outputs.impect_id }}" \
              --manifest "dist/${{ steps.fixture.outputs.impect_id }}/manifest.json"
        env:
          CHROME_BIN: ${{ github.workspace }}/scripts/chrome_ci.sh
          REAL_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Post-mortem on generate failure
        if: always() && steps.fixture.outputs.ready == 'true' && steps.release.outputs.exists == 'false'
        run: |
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null || echo "dmesg unavailable") | tail -80
          free -m

      - name: Upload diagnostic bundle
        if: steps.fixture.outputs.ready == 'true' && steps.release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: post-match-${{ steps.fixture.outputs.impect_id }}
          path: dist/${{ steps.fixture.outputs.impect_id }}/
          retention-days: 30

      - name: Publish private report archive
        if: >-
          steps.fixture.outputs.ready == 'true' &&
          steps.release.outputs.exists == 'false' &&
          (github.event_name == 'schedule' || inputs.archive_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: match-${{ steps.fixture.outputs.impect_id }}
        run: |
          gh release create "$TAG" dist/${{ steps.fixture.outputs.impect_id }}/* \
            --title "Post-match reports $TAG" \
            --notes "delivery_mode: manual_email\ngenerated_at_utc: $(date -u +%FT%TZ)"
