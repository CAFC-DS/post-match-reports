[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "set-piece-report"
version = "0.1.0"
description = "One-page single-match set-piece report from IMPECT event data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=16.1.0",
  "snowflake-connector-python[pandas]>=3.10.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "cryptography>=42.0.0",
  "matplotlib>=3.8.0",
  "mplsoccer>=1.2.4",
  "jinja2>=3.1",
  "weasyprint>=60",
]

[tool.setuptools]
packages = ["set_piece_report", "src", "src.db", "src.visualisation"]
